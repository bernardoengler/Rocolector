<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escáner de inventario</title>
<style>
  :root{
    --bg: #1a1d18;
    --panel: #22261f;
    --panel-line: #383d33;
    --ink: #eee9dd;
    --ink-dim: #9aa090;
    --accent: #ff5a36;
    --accent-dim: #7a3020;
    --ok: #6fae5e;
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  html, body{
    margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body{ padding-bottom: 48px; }
  header{
    padding: 18px 16px 10px;
    border-bottom: 1px solid var(--panel-line);
  }
  header h1{
    margin:0; font-size: 17px; font-weight: 700; letter-spacing: 0.2px;
  }
  header p{
    margin: 4px 0 0; font-size: 12.5px; color: var(--ink-dim);
  }

  main{ padding: 14px 14px 0; max-width: 480px; margin: 0 auto; }

  .scanner{
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #05060a;
    border: 1px solid var(--panel-line);
    border-radius: var(--radius);
    overflow: hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .scanner video{
    width:100%; height:100%; object-fit: cover; display:none;
  }
  .scanner.live video{ display:block; }
  .scan-placeholder{
    color: var(--ink-dim); font-size: 13px; text-align:center; padding: 0 20px;
  }
  .scan-line{
    position:absolute; left:6%; right:6%; height:2px; background: var(--accent);
    box-shadow: 0 0 8px 1px var(--accent);
    top: 50%; display:none;
    animation: sweep 1.6s ease-in-out infinite;
  }
  .scanner.live .scan-line{ display:block; }
  @keyframes sweep{
    0%   { top: 12%; opacity: .95; }
    50%  { top: 88%; opacity: .6; }
    100% { top: 12%; opacity: .95; }
  }
  .scan-frame{
    position:absolute; inset: 10% 8%; border: 1px solid rgba(238,233,221,0.35);
    pointer-events:none; display:none;
  }
  .scanner.live .scan-frame{ display:block; }

  .scan-controls{
    display:flex; gap:8px; margin-top: 10px;
  }
  button{
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    border-radius: var(--radius); border: 1px solid var(--panel-line);
    background: var(--panel); color: var(--ink);
    padding: 10px 14px; cursor: pointer;
  }
  button:active{ transform: translateY(1px); }
  button.primary{
    background: var(--accent); border-color: var(--accent); color: #1a0d08;
  }
  button.ghost{ background: transparent; }
  button:disabled{ opacity: .45; cursor: default; }

  .status-line{
    font-size: 12px; color: var(--ink-dim); margin-top: 6px; min-height: 16px;
  }
  .status-line.ok{ color: var(--ok); }

  section.card{
    margin-top: 18px; border: 1px solid var(--panel-line); border-radius: var(--radius);
    background: var(--panel); padding: 14px;
  }
  section.card h2{
    margin: 0 0 10px; font-size: 12px; text-transform: none;
    color: var(--ink-dim); font-weight: 600;
  }
  label{ display:block; font-size: 12px; color: var(--ink-dim); margin: 10px 0 4px; }
  label:first-of-type{ margin-top: 0; }
  input[type=text], input[type=number]{
    width:100%; background: #171a14; border: 1px solid var(--panel-line);
    color: var(--ink); border-radius: var(--radius); padding: 10px 10px;
    font-size: 14px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  input[type=text]:focus, input[type=number]:focus{
    outline: none; border-color: var(--accent);
  }
  input#f-barcode{ letter-spacing: 0.5px; }

  .save-row{ margin-top: 14px; display:flex; gap: 8px; }
  .save-row button{ flex:1; }

  .list-head{
    display:flex; align-items:baseline; justify-content: space-between;
    margin-top: 22px; margin-bottom: 8px;
  }
  .list-head h2{ margin:0; font-size: 13px; color: var(--ink); font-weight: 700; }
  .list-head span{ font-size: 12px; color: var(--ink-dim); }

  .record{
    border: 1px solid var(--panel-line); border-radius: var(--radius);
    padding: 10px 12px; margin-bottom: 8px; background: var(--panel);
    display:flex; justify-content: space-between; gap: 10px;
  }
  .record .main{ min-width:0; }
  .record .code{
    font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--accent);
  }
  .record .fields{ font-size: 12.5px; color: var(--ink-dim); margin-top: 3px; line-height:1.5; }
  .record .fields b{ color: var(--ink); font-weight: 500; }
  .record button.del{
    align-self: center; border: none; background: transparent; color: var(--ink-dim);
    font-size: 16px; padding: 4px 6px;
  }
  .empty{
    font-size: 13px; color: var(--ink-dim); text-align:center; padding: 20px 10px;
    border: 1px dashed var(--panel-line); border-radius: var(--radius);
  }

  .export-row{ display:flex; gap:8px; margin-top: 14px; }
  .export-row button{ flex:1; }
  textarea#csv-out{
    width:100%; margin-top:10px; height: 110px; background:#171a14; color: var(--ink);
    border:1px solid var(--panel-line); border-radius: var(--radius); font-size: 11.5px;
    font-family: ui-monospace, Menlo, monospace; padding: 8px; display:none;
  }
</style>
</head>
<body>

<header>
  <h1>Escáner de inventario</h1>
  <p>Escaneá un código de barras y sumale los datos que necesites.</p>
</header>

<main>

  <div class="scanner" id="scanner">
    <div class="scan-placeholder" id="scan-placeholder">La cámara aparece acá.<br>Tocá "Escanear" para empezar.</div>
    <video id="video" playsinline muted></video>
    <div class="scan-frame"></div>
    <div class="scan-line"></div>
  </div>

  <div class="scan-controls">
    <button class="primary" id="btn-start">Escanear</button>
    <button class="ghost" id="btn-stop" disabled>Detener</button>
  </div>
  <div class="status-line" id="status"></div>

  <section class="card">
    <h2>Nuevo registro</h2>

    <label for="f-barcode">Código de barras</label>
    <input type="text" id="f-barcode" placeholder="Se completa al escanear, o escribilo a mano">

    <label for="f-nombre">Nombre / producto</label>
    <input type="text" id="f-nombre" placeholder="Ej: Yerba 1kg">

    <label for="f-cantidad">Cantidad</label>
    <input type="number" id="f-cantidad" placeholder="Ej: 10" inputmode="numeric">

    <label for="f-ubicacion">Ubicación / nota</label>
    <input type="text" id="f-ubicacion" placeholder="Ej: Estante 3, depósito">

    <div class="save-row">
      <button class="primary" id="btn-save">Guardar registro</button>
      <button class="ghost" id="btn-clear">Limpiar</button>
    </div>
  </section>

  <div class="list-head">
    <h2>Registros guardados</h2>
    <span id="count">0</span>
  </div>
  <div id="list"></div>

  <div class="export-row">
    <button id="btn-export">Exportar CSV</button>
    <button class="ghost" id="btn-wipe">Borrar todo</button>
  </div>
  <textarea id="csv-out" readonly></textarea>

</main>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const scannerBox = $('scanner');
  const video = $('video');
  const placeholder = $('scan-placeholder');
  const btnStart = $('btn-start');
  const btnStop = $('btn-stop');
  const statusEl = $('status');
  const listEl = $('list');
  const countEl = $('count');
  const csvOut = $('csv-out');

  const fBarcode = $('f-barcode');
  const fNombre = $('f-nombre');
  const fCantidad = $('f-cantidad');
  const fUbicacion = $('f-ubicacion');

  const STORAGE_KEY = 'escaner-inventario:registros';
  let records = [];
  let stream = null;
  let detector = null;
  let scanLoopId = null;

  function setStatus(msg, ok){
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('ok', !!ok);
  }

  // ---------- Persistencia ----------
  async function loadRecords(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      records = res ? JSON.parse(res.value) : [];
    }catch(e){
      records = [];
    }
    renderList();
  }

  async function persist(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(records), false);
    }catch(e){
      setStatus('No se pudo guardar en el almacenamiento. Probá de nuevo.', false);
    }
  }

  // ---------- Lista ----------
  function renderList(){
    countEl.textContent = records.length;
    if(records.length === 0){
      listEl.innerHTML = '<div class="empty">Todavía no guardaste ningún registro.</div>';
      return;
    }
    listEl.innerHTML = records.slice().reverse().map((r) => `
      <div class="record" data-id="${r.id}">
        <div class="main">
          <div class="code">${escapeHtml(r.barcode || '(sin código)')}</div>
          <div class="fields">
            <b>${escapeHtml(r.nombre || '—')}</b> · Cant: ${escapeHtml(r.cantidad || '—')} · ${escapeHtml(r.ubicacion || '—')}
          </div>
        </div>
        <button class="del" data-id="${r.id}" title="Borrar">✕</button>
      </div>
    `).join('');

    listEl.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        records = records.filter(r => String(r.id) !== id);
        persist();
        renderList();
      });
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // ---------- Guardar ----------
  $('btn-save').addEventListener('click', () => {
    const barcode = fBarcode.value.trim();
    if(!barcode){
      setStatus('Ingresá o escaneá un código de barras primero.', false);
      return;
    }
    records.push({
      id: Date.now(),
      barcode,
      nombre: fNombre.value.trim(),
      cantidad: fCantidad.value.trim(),
      ubicacion: fUbicacion.value.trim(),
      fecha: new Date().toISOString()
    });
    persist();
    renderList();
    clearForm();
    setStatus('Registro guardado.', true);
  });

  $('btn-clear').addEventListener('click', clearForm);
  function clearForm(){
    fBarcode.value = '';
    fNombre.value = '';
    fCantidad.value = '';
    fUbicacion.value = '';
  }

  $('btn-wipe').addEventListener('click', () => {
    if(records.length === 0) return;
    if(confirm('¿Borrar todos los registros guardados?')){
      records = [];
      persist();
      renderList();
    }
  });

  // ---------- Cámara + detección ----------
  function barcodeDetectorSupported(){
    return 'BarcodeDetector' in window;
  }

  async function startScan(){
    if(!barcodeDetectorSupported()){
      setStatus('Este navegador no tiene lector de códigos nativo. Ingresá el código a mano abajo, o probá abriendo esta página en Chrome para Android.', false);
      return;
    }
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }
      });
    }catch(e){
      setStatus('No se pudo acceder a la cámara. Revisá los permisos del navegador.', false);
      return;
    }

    video.srcObject = stream;
    await video.play();
    scannerBox.classList.add('live');
    placeholder.style.display = 'none';
    btnStart.disabled = true;
    btnStop.disabled = false;
    setStatus('Buscando código…');

    detector = new window.BarcodeDetector({
      formats: ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code','itf']
    });

    scanFrame();
  }

  async function scanFrame(){
    if(!stream) return;
    try{
      const codes = await detector.detect(video);
      if(codes && codes.length > 0){
        const value = codes[0].rawValue;
        fBarcode.value = value;
        setStatus('Código detectado: ' + value, true);
        if(navigator.vibrate) navigator.vibrate(80);
        stopScan();
        return;
      }
    }catch(e){
      // frame sin resultado, seguimos
    }
    scanLoopId = requestAnimationFrame(scanFrame);
  }

  function stopScan(){
    if(scanLoopId) cancelAnimationFrame(scanLoopId);
    scanLoopId = null;
    if(stream){
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    scannerBox.classList.remove('live');
    placeholder.style.display = 'flex';
    btnStart.disabled = false;
    btnStop.disabled = true;
  }

  btnStart.addEventListener('click', startScan);
  btnStop.addEventListener('click', () => { stopScan(); setStatus(''); });

  // ---------- Exportar ----------
  $('btn-export').addEventListener('click', () => {
    if(records.length === 0){
      setStatus('No hay registros para exportar.', false);
      return;
    }
    const header = ['codigo_barras','nombre','cantidad','ubicacion','fecha'];
    const rows = records.map(r => [r.barcode, r.nombre, r.cantidad, r.ubicacion, r.fecha]
      .map(v => '"' + String(v || '').replace(/"/g,'""') + '"').join(','));
    const csv = [header.join(','), ...rows].join('\n');

    let downloaded = false;
    try{
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'inventario.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      downloaded = true;
    }catch(e){ /* seguimos al respaldo */ }

    csvOut.style.display = 'block';
    csvOut.value = csv;
    setStatus(downloaded ? 'CSV descargado. Si no se abrió solo, copialo del cuadro de abajo.' : 'Copiá el CSV del cuadro de abajo.', true);
  });

  loadRecords();
})();
</script>

</body>
</html>
