<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Escáner de Inventario | Repuestos</title>
  <link rel="icon" type="image/png" href="../imagenes/Favicon01.png">

  <!-- Firebase / autenticación: se conserva la integración del sitio -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="/js/auth.js" defer></script>
  <script src="/js/auth-check.js" defer></script>

  <style>

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* =================== PANTALLA =================== */
      body {
        min-height: 100vh;
        font-family: 'Segoe UI', sans-serif;
        background:
          linear-gradient(rgba(0, 30, 15, .82), rgba(0, 30, 15, .82)),
          url("../imagenes/FondoInicio.jpg") center/cover fixed;
        color: #fff;
        display: flex;
        justify-content: center;
        padding: 25px 15px 35px;
      }

      /* =================== CONTENEDOR =================== */
      .container {
        width: 90%;
        max-width: 900px;
        text-align: center;
      }

      /* =================== LOGO =================== */
      .logo {
        width: 300px;
        max-width: 80%;
        margin-bottom: 25px;
      }

      /* =================== TITULOS =================== */
      h1 {
        color: #fff;
        font-size: 1.8rem;
        font-weight: 300;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 8px;
        display: inline-block;
        position: relative;
        padding: 0 80px;
      }

      h1::before,
      h1::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 60px;
        height: 2px;
        background: #ffde00;
      }

      h1::before { left: 0; }
      h1::after { right: 0; }

      .subtitulo {
        color: #fff;
        font-size: 1.25rem;
        font-weight: 300;
        margin-bottom: 30px;
      }

      /* =================== TARJETAS =================== */
      .card {
        margin-top: 18px;
        padding: 25px;
        background: rgba(255,255,255,.08);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,.15);
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,.35);
      }

      /* =================== ESCANER =================== */
      .scanner {
        position: relative;
        width: 100%;
        max-width: 720px;
        aspect-ratio: 3.6 / 1;
        margin: 0 auto;
        background: #050805;
        border: 2px solid rgba(255,255,255,.18);
        border-radius: 15px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .scanner video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }

      .scanner.live video { display: block; }

      .scan-placeholder {
        color: #ddd;
        font-size: 14px;
        line-height: 1.7;
        text-align: center;
      }

      .scan-line {
        position: absolute;
        left: 6%;
        right: 6%;
        height: 2px;
        background: #ffde00;
        box-shadow: 0 0 10px #ffde00;
        top: 50%;
        display: none;
        animation: sweep 1.6s ease-in-out infinite;
      }

      .scanner.live .scan-line { display: block; }

      @keyframes sweep {
        0% { top: 12%; opacity: .95; }
        50% { top: 88%; opacity: .6; }
        100% { top: 12%; opacity: .95; }
      }

      .scan-frame {
        position: absolute;
        inset: 10% 8%;
        border: 2px solid rgba(255,255,255,.5);
        border-radius: 10px;
        pointer-events: none;
        display: none;
      }

      .scanner.live .scan-frame { display: block; }

      /* =================== BOTONES =================== */
      .scan-controls,
      .save-row,
      .export-row {
        display: flex;
        gap: 12px;
        margin-top: 15px;
      }

      button {
        flex: 1;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        border-radius: 12px;
        border: none;
        padding: 12px 20px;
        cursor: pointer;
        transition: .3s;
      }

      button:active { transform: translateY(1px); }

      button.primary {
        background: #367c2b;
        color: #fff;
      }

      button.primary:hover {
        background: #ffde00;
        color: #1d1d1d;
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0,0,0,.3);
      }

      button.ghost {
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.2);
        color: #fff;
      }

      button.ghost:hover {
        background: rgba(255,255,255,.18);
      }

      button:disabled {
        opacity: .4;
        cursor: default;
        transform: none;
      }

      /* =================== ESTADO =================== */
      .status-line {
        font-size: 13px;
        color: #ddd;
        margin-top: 10px;
        min-height: 18px;
      }

      .status-line.ok { color: #ffde00; }

      /* =================== FORMULARIO =================== */
      section.card h2,
      .export-card h2 {
        margin: 0 0 15px;
        color: #fff;
        font-size: 15px;
        font-weight: 500;
        text-align: left;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      label {
        display: block;
        font-size: 12px;
        color: #ddd;
        margin: 12px 0 5px;
        text-align: left;
      }

      input[type=text],
      input[type=number] {
        width: 100%;
        background: rgba(0,0,0,.3);
        border: 1px solid rgba(255,255,255,.18);
        color: #fff;
        border-radius: 10px;
        padding: 12px;
        font-size: 14px;
        font-family: 'Segoe UI', sans-serif;
      }

      input[type=text]:focus,
      input[type=number]:focus {
        outline: none;
        border-color: #ffde00;
        box-shadow: 0 0 0 2px rgba(255,222,0,.12);
      }

      input::placeholder { color: #999; }

      input#f-barcode { letter-spacing: .5px; }

      /* =================== LISTADO =================== */
      .list-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 25px;
        margin-bottom: 10px;
        padding: 0 5px;
      }

      .list-head h2 {
        font-size: 14px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .list-head span {
        background: #ffde00;
        color: #1d1d1d;
        border-radius: 20px;
        min-width: 28px;
        padding: 4px 8px;
        font-size: 12px;
        font-weight: 700;
      }

      .record {
        border: 1px solid rgba(255,255,255,.15);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 9px;
        background: rgba(255,255,255,.07);
        display: flex;
        justify-content: space-between;
        gap: 10px;
        text-align: left;
      }

      .record .main { min-width: 0; }

      .record .code {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 14px;
        color: #ffde00;
        font-weight: 600;
      }

      .record .fields {
        font-size: 12.5px;
        color: #ccc;
        margin-top: 5px;
        line-height: 1.5;
      }

      .record .fields b {
        color: #fff;
        font-weight: 600;
      }

      .record button.del {
        align-self: center;
        border: none;
        background: transparent;
        color: #aaa;
        font-size: 17px;
        padding: 5px;
        flex: none;
      }

      .record button.del:hover {
        color: #ffde00;
      }

      .empty {
        font-size: 13px;
        color: #bbb;
        text-align: center;
        padding: 25px 10px;
        border: 1px dashed rgba(255,255,255,.2);
        border-radius: 12px;
      }

      /* =================== CSV =================== */
      textarea#csv-out {
        width: 100%;
        margin-top: 12px;
        height: 110px;
        background: rgba(0,0,0,.3);
        color: #ddd;
        border: 1px solid rgba(255,255,255,.15);
        border-radius: 10px;
        font-size: 11px;
        font-family: monospace;
        padding: 10px;
        display: none;
      }

      .email-note {
        margin-top: 9px;
        color: #aaa;
        font-size: 11px;
        line-height: 1.4;
        text-align: left;
      }

      /* =================== FOOTER =================== */
      .footer {
        margin-top: 30px;
        color: #ccc;
        font-size: .85rem;
        line-height: 1.6;
      }

      /* =================== RESPONSIVE =================== */
      @media (max-width: 768px) {
        body {
          padding: 20px 10px 30px;
        }

        .container {
          width: 94%;
        }

        .logo {
          width: 240px;
        }

        h1 {
          font-size: 1.1rem;
          letter-spacing: 2px;
          padding: 0 35px;
        }

        h1::before,
        h1::after {
          width: 25px;
        }

        .subtitulo {
          font-size: 1rem;
          margin-bottom: 20px;
        }

        .card {
          padding: 18px;
          border-radius: 16px;
        }

        .scanner {
          aspect-ratio: 2.8 / 1;
        }

        .scan-controls,
        .save-row,
        .export-row {
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }

  </style>
</head>

<body>

  <div class="container">

    <h1>Recolector de datos</h1>

    <div class="subtitulo">
      Castro S.A. | Repuestos
    </div>

    <div class="card">

      <div class="scanner" id="scanner">
        <div class="scan-placeholder" id="scan-placeholder">
          Apuntá al código de barras.<br>
          Tocá <b>"Escanear"</b> para comenzar.
        </div>

        <video id="video" playsinline muted></video>
        <div class="scan-frame"></div>
        <div class="scan-line"></div>
      </div>

      <div class="scan-controls">
        <button class="primary" id="btn-start">📷 Escanear</button>
        <button class="ghost" id="btn-stop" disabled>Detener</button>
      </div>

      <div class="status-line" id="status"></div>

    </div>

    <section class="card">

      <h2>Nuevo registro</h2>

      <label for="f-barcode">Código de barras</label>
      <input
        type="text"
        id="f-barcode"
        placeholder="Se completa al escanear"
      >

      <label for="f-nombre">Nombre / producto</label>
      <input
        type="text"
        id="f-nombre"
        placeholder="Ej: Repuesto John Deere"
      >

      <label for="f-cantidad">Cantidad</label>
      <input
        type="number"
        id="f-cantidad"
        placeholder="Ej: 10"
        inputmode="numeric"
      >

      <label for="f-ubicacion">Ubicación / nota</label>
      <input
        type="text"
        id="f-ubicacion"
        placeholder="Ej: A-03-12"
      >

      <div class="save-row">
        <button class="primary" id="btn-save">✓ Guardar registro</button>
        <button class="ghost" id="btn-clear">Limpiar</button>
      </div>

    </section>

    <div class="list-head">
      <h2>Registros guardados</h2>
      <span id="count">0</span>
    </div>

    <div id="list"></div>

    <div class="card export-card">

      <h2>Envío de registros</h2>

      <div class="export-row">
        <button class="primary" id="btn-export">📤 Enviar inventario</button>
        <button class="ghost" id="btn-wipe">🗑 Borrar todo</button>
      </div>

      <textarea id="csv-out" readonly aria-label="Datos CSV"></textarea>
      <div class="email-note">Se genera el archivo y se abre el menú de compartir del celular.</div>

    </div>

    <div class="footer">
      © 2026 Castro S.A. - Todos los derechos reservados
    </div>

  </div>


<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const scannerBox = $('scanner');
  const video = $('video');
  const placeholder = $('scan-placeholder');
  const btnStart = $('btn-start');
  const btnStop = $('btn-stop');
  const statusEl = $('status');
  const listEl = $('list');
  const countEl = $('count');
  const csvOut = $('csv-out');

  const fBarcode = $('f-barcode');
  const fNombre = $('f-nombre');
  const fCantidad = $('f-cantidad');
  const fUbicacion = $('f-ubicacion');

  const STORAGE_KEY = 'escaner-inventario:registros';
  let records = [];
  let stream = null;
  let detector = null;
  let scanLoopId = null;

  function setStatus(msg, ok){
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('ok', !!ok);
  }

  // ---------- Persistencia ----------
  async function loadRecords(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      records = res ? JSON.parse(res.value) : [];
    }catch(e){
      records = [];
    }
    renderList();
  }

  async function persist(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(records), false);
    }catch(e){
      setStatus('No se pudo guardar en el almacenamiento. Probá de nuevo.', false);
    }
  }

  // ---------- Lista ----------
  function renderList(){
    countEl.textContent = records.length;
    if(records.length === 0){
      listEl.innerHTML = '<div class="empty">Todavía no guardaste ningún registro.</div>';
      return;
    }
    listEl.innerHTML = records.slice().reverse().map((r) => `
      <div class="record" data-id="${r.id}">
        <div class="main">
          <div class="code">${escapeHtml(r.barcode || '(sin código)')}</div>
          <div class="fields">
            <b>${escapeHtml(r.nombre || '—')}</b> · Cant: ${escapeHtml(r.cantidad || '—')} · ${escapeHtml(r.ubicacion || '—')}
          </div>
        </div>
        <button class="del" data-id="${r.id}" title="Borrar">✕</button>
      </div>
    `).join('');

    listEl.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        records = records.filter(r => String(r.id) !== id);
        persist();
        renderList();
      });
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // ---------- Guardar ----------
  $('btn-save').addEventListener('click', () => {
    const barcode = fBarcode.value.trim();
    if(!barcode){
      setStatus('Ingresá o escaneá un código de barras primero.', false);
      return;
    }
    records.push({
      id: Date.now(),
      barcode,
      nombre: fNombre.value.trim(),
      cantidad: fCantidad.value.trim(),
      ubicacion: fUbicacion.value.trim(),
      fecha: new Date().toISOString()
    });
    persist();
    renderList();
    clearForm();
    setStatus('Registro guardado.', true);
  });

  $('btn-clear').addEventListener('click', clearForm);
  function clearForm(){
    fBarcode.value = '';
    fNombre.value = '';
    fCantidad.value = '';
    fUbicacion.value = '';
  }

  $('btn-wipe').addEventListener('click', () => {
    if(records.length === 0) return;
    if(confirm('¿Borrar todos los registros guardados?')){
      records = [];
      persist();
      renderList();
    }
  });

  // ---------- Cámara + detección ----------
  function barcodeDetectorSupported(){
    return 'BarcodeDetector' in window;
  }

  async function startScan(){
    if(!barcodeDetectorSupported()){
      setStatus('Este navegador no tiene lector de códigos nativo. Ingresá el código a mano abajo, o probá abriendo esta página en Chrome para Android.', false);
      return;
    }
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }
      });
    }catch(e){
      setStatus('No se pudo acceder a la cámara. Revisá los permisos del navegador.', false);
      return;
    }

    video.srcObject = stream;
    await video.play();
    scannerBox.classList.add('live');
    placeholder.style.display = 'none';
    btnStart.disabled = true;
    btnStop.disabled = false;
    setStatus('Buscando código…');

    detector = new window.BarcodeDetector({
      formats: ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code','itf']
    });

    scanFrame();
  }

  async function scanFrame(){
    if(!stream) return;
    try{
      const codes = await detector.detect(video);
      if(codes && codes.length > 0){
        const value = codes[0].rawValue;
        fBarcode.value = value;
        setStatus('Código detectado: ' + value, true);
        if(navigator.vibrate) navigator.vibrate(80);
        stopScan();
        return;
      }
    }catch(e){
      // frame sin resultado, seguimos
    }
    scanLoopId = requestAnimationFrame(scanFrame);
  }

  function stopScan(){
    if(scanLoopId) cancelAnimationFrame(scanLoopId);
    scanLoopId = null;
    if(stream){
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    scannerBox.classList.remove('live');
    placeholder.style.display = 'flex';
    btnStart.disabled = false;
    btnStop.disabled = true;
  }

  btnStart.addEventListener('click', startScan);
  btnStop.addEventListener('click', () => { stopScan(); setStatus(''); });

  // ---------- Enviar inventario ----------
  $('btn-export').addEventListener('click', async () => {
    if(records.length === 0){
      setStatus('No hay registros para enviar.', false);
      return;
    }

    const header = ['codigo_barras','nombre','cantidad','ubicacion','fecha'];
    const rows = records.map(r =>
      [r.barcode, r.nombre, r.cantidad, r.ubicacion, r.fecha]
        .map(v => '"' + String(v || '').replace(/"/g,'""') + '"')
        .join(',')
    );

    const csv = '\ufeff' + [header.join(','), ...rows].join('\r\n');
    const fecha = new Date().toLocaleDateString('es-AR').replace(/\//g,'-');
    const fileName = 'Inventario_Repuestos_' + fecha + '.csv';
    const file = new File([csv], fileName, { type: 'text/csv;charset=utf-8' });

    const shareData = {
      title: 'Inventario de Repuestos - Castro S.A.',
      text: 'Inventario de repuestos. Registros: ' + records.length,
      files: [file]
    };

    // En Android compatible, esto abre el menú nativo de compartir
    // con el CSV ya preparado como archivo adjunto.
    try {
      if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
        await navigator.share(shareData);
        setStatus('Inventario listo para compartir.', true);
        return;
      }
    } catch(err) {
      // El usuario puede cerrar el menú de compartir: no hacemos nada.
      if (err && err.name === 'AbortError') return;
    }

    // Fallback: descarga el CSV si el navegador no soporta compartir archivos.
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setStatus('Tu navegador no permite compartir archivos directamente. Se descargó el CSV.', true);
  });
  loadRecords();
})();
</script>

</body>
